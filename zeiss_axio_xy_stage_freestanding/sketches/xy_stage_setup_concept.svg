<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <pattern id="ballastHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9ca3af" stroke-width="2"/>
    </pattern>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #4b5563; }
      .panel { font: 700 22px Arial, sans-serif; fill: #111827; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px Arial, sans-serif; fill: #374151; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #6b7280; }
      .body { fill: #e5e7eb; stroke: #6b7280; stroke-width: 2; }
      .dark { fill: #d1d5db; stroke: #4b5563; stroke-width: 2; }
      .stage { fill: #cbd5e1; stroke: #475569; stroke-width: 2; }
      .pod { fill: #f3f4f6; stroke: #374151; stroke-width: 2; }
      .ballast { fill: url(#ballastHatch); stroke: #6b7280; stroke-width: 1.5; }
      .slot { fill: #ffffff; stroke: #6b7280; stroke-width: 1.5; }
      .cable { fill: none; stroke: #6b7280; stroke-width: 3; stroke-dasharray: 8 5; }
      .xbelt { fill: none; stroke: #f97316; stroke-width: 8; stroke-linecap: round; }
      .ybelt { fill: none; stroke: #2563eb; stroke-width: 8; stroke-linecap: round; }
      .pulleyX { fill: #fed7aa; stroke: #ea580c; stroke-width: 3; }
      .pulleyY { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 3; }
      .dim { fill: none; stroke: #4b5563; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .guide { fill: none; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .diskEdgeX { fill: #fed7aa; stroke: #ea580c; stroke-width: 2; }
      .diskEdgeY { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 2; }
      .noteBox { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
  <text x="56" y="54" class="title">Zeiss Axio XY-Only Freestanding Motor Pod Concept</text>
  <text x="56" y="84" class="subtitle">Two-view sketch: left = side/elevation for heights, right = top/plan for actual belt drive geometry.</text>

  <!-- LEFT PANEL -->
  <text x="70" y="130" class="panel">Side / Elevation View</text>
  <line x1="50" y1="700" x2="670" y2="700" stroke="#111827" stroke-width="4"/>
  <text x="70" y="738" class="label">table / benchtop</text>

  <!-- microscope -->
  <rect x="90" y="520" width="220" height="180" rx="16" class="body"/>
  <rect x="190" y="380" width="210" height="140" rx="12" class="stage"/>
  <rect x="220" y="315" width="140" height="65" rx="8" class="body"/>
  <text x="122" y="304" class="label">microscope</text>
  <text x="218" y="371" class="label">stage underside</text>

  <!-- shaft + knob pulleys as horizontal disks seen from side -->
  <rect x="430" y="555" width="16" height="72" rx="8" class="dark"/>
  <rect x="402" y="585" width="72" height="12" rx="5" class="diskEdgeX"/>
  <rect x="396" y="558" width="84" height="12" rx="5" class="diskEdgeY"/>
  <text x="500" y="563" class="label">Y knob pulley</text>
  <text x="500" y="592" class="label">X knob pulley</text>
  <text x="500" y="614" class="small">both pulleys are horizontal disks on a vertical shaft</text>

  <!-- X pod -->
  <rect x="520" y="672" width="120" height="28" class="pod"/>
  <rect x="538" y="676" width="84" height="20" class="ballast"/>
  <rect x="555" y="510" width="14" height="162" class="pod"/>
  <rect x="595" y="510" width="14" height="162" class="pod"/>
  <rect x="565" y="540" width="34" height="92" class="slot"/>
  <rect x="549" y="560" width="6" height="70" rx="3" class="slot"/>
  <rect x="609" y="560" width="6" height="70" rx="3" class="slot"/>
  <rect x="540" y="516" width="84" height="16" class="slot"/>
  <rect x="534" y="574" width="86" height="10" class="pod"/>
  <rect x="557" y="548" width="40" height="26" class="dark"/>
  <rect x="545" y="585" width="64" height="10" rx="4" class="diskEdgeX"/>
  <line x1="474" y1="591" x2="545" y2="591" class="xbelt"/>
  <text x="525" y="497" class="label">X motor pod</text>

  <!-- Y pod -->
  <rect x="770" y="672" width="120" height="28" class="pod"/>
  <rect x="788" y="676" width="84" height="20" class="ballast"/>
  <rect x="805" y="480" width="14" height="192" class="pod"/>
  <rect x="845" y="480" width="14" height="192" class="pod"/>
  <rect x="815" y="512" width="34" height="104" class="slot"/>
  <rect x="799" y="532" width="6" height="70" rx="3" class="slot"/>
  <rect x="859" y="532" width="6" height="70" rx="3" class="slot"/>
  <rect x="790" y="486" width="84" height="16" class="slot"/>
  <rect x="784" y="547" width="86" height="10" class="pod"/>
  <rect x="807" y="522" width="40" height="26" class="dark"/>
  <rect x="795" y="558" width="64" height="10" rx="4" class="diskEdgeY"/>
  <line x1="480" y1="564" x2="795" y2="564" class="ybelt"/>
  <text x="775" y="467" class="label">Y motor pod</text>

  <!-- cable paths -->
  <path d="M 597 560 C 618 548, 630 532, 628 524" class="cable"/>
  <path d="M 847 535 C 868 522, 880 505, 878 494" class="cable"/>

  <!-- dimensions -->
  <line x1="34" y1="700" x2="34" y2="615" class="dim"/>
  <text x="8" y="660" class="small">85 mm</text>
  <line x1="16" y1="700" x2="16" y2="588" class="dim"/>
  <text x="0" y="645" class="small">109 mm</text>
  <line x1="-2" y1="700" x2="-2" y2="520" class="dim"/>
  <text x="0" y="612" class="small">180 mm</text>
  <line x1="34" y1="615" x2="430" y2="615" class="guide"/>
  <line x1="16" y1="588" x2="430" y2="588" class="guide"/>
  <line x1="-2" y1="520" x2="399" y2="520" class="guide"/>

  <!-- RIGHT PANEL -->
  <text x="760" y="130" class="panel">Top / Plan View</text>
  <rect x="760" y="170" width="580" height="520" rx="12" fill="#fafafa" stroke="#e5e7eb" stroke-width="2"/>

  <!-- stage footprint -->
  <rect x="850" y="270" width="220" height="120" rx="10" class="stage"/>
  <text x="900" y="255" class="label">stage footprint above</text>

  <!-- stacked knob axis -->
  <circle cx="1120" cy="330" r="36" class="pulleyY"/>
  <circle cx="1120" cy="330" r="28" class="pulleyX"/>
  <circle cx="1120" cy="330" r="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="1158" y="314" class="label">stacked X/Y knob pulleys</text>
  <text x="1158" y="336" class="small">same vertical shaft axis</text>

  <!-- X pod top -->
  <rect x="770" y="500" width="150" height="90" class="pod"/>
  <rect x="790" y="520" width="110" height="50" class="ballast"/>
  <circle cx="845" cy="448" r="16" class="pulleyX"/>
  <rect x="820" y="448" width="50" height="72" rx="6" class="dark"/>
  <path d="M 1100 352 C 1045 410, 980 448, 861 448" class="xbelt"/>
  <text x="772" y="616" class="label">X pod</text>
  <text x="772" y="636" class="small">motor shaft vertical</text>
  <text x="772" y="656" class="small">small metal GT2 pulley on shaft</text>

  <!-- Y pod top -->
  <rect x="770" y="190" width="150" height="90" class="pod"/>
  <rect x="790" y="210" width="110" height="50" class="ballast"/>
  <circle cx="845" cy="330" r="16" class="pulleyY"/>
  <rect x="820" y="260" width="50" height="72" rx="6" class="dark"/>
  <path d="M 1084 330 C 1030 330, 980 330, 861 330" class="ybelt"/>
  <text x="772" y="160" class="label">Y pod</text>
  <text x="772" y="180" class="small">placed farther back or forward as needed</text>

  <!-- callouts -->
  <line x1="845" y1="448" x2="930" y2="448" class="guide"/>
  <text x="940" y="452" class="small">motor pulley drives belt directly</text>
  <line x1="845" y1="330" x2="930" y2="330" class="guide"/>
  <text x="940" y="334" class="small">same geometry for Y axis at different height</text>

  <rect x="950" y="508" width="350" height="122" rx="10" class="noteBox"/>
  <text x="970" y="538" class="label">How the motor drives the belt</text>
  <text x="970" y="565" class="small">1. NEMA17 is mounted shaft-up on the adjustable plate.</text>
  <text x="970" y="590" class="small">2. A metal GT2 pulley is fixed to the 5 mm motor shaft.</text>
  <text x="970" y="615" class="small">3. The GT2 belt runs horizontally from motor pulley to knob pulley.</text>

  <!-- bottom notes -->
  <text x="70" y="812" class="label">Interpretation</text>
  <text x="70" y="838" class="small">The pods are freestanding and only provide vertically oriented motor shafts. The belt plane is horizontal.</text>
  <text x="70" y="862" class="small">The previous single-view sketch implied the wrong pulley orientation. This two-view sketch is the intended setup.</text>
</svg>
