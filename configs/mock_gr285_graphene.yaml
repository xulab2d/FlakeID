config_key: gr285_graphene
material: graphene
substrate: Si/SiO2 wet oxide
oxide_thickness_nm: 285
objective_magnification: 20
config_version: 0.1.0
hardware:
  backend: mock
  objective: 20x
  pixel_size_um: 0.5
  frame_width_px: 1024
  frame_height_px: 768
  overlap: 0.1
  roi:
    x_mm: 0.0
    y_mm: 0.0
    width_mm: 3.0
    height_mm: 3.0
camera:
  exposure_ms: 20.0
  gain: 0.0
  illumination:
    brightness: 0.75
focus:
  mode: none
preprocessing:
  demosaic: false
  linearize: false
  darkframe_subtraction: false
  flatfield_correction: false
  normalize_background: true
detector:
  name: 2dmatgmm
  size_threshold: 150
  std_threshold: 5.0
  confidence_threshold: 0.25
ranking:
  weights:
    confidence: 0.25
    area: 0.15
    isolation: 0.1
    edge_straightness: 0.1
    compactness: 0.1
    background_cleanliness: 0.1
    focus_score: 0.1
    layer_bin: 0.05
    contrast_sanity: 0.05
  layer_preferences:
    thin: 0.9
    unknown: 0.5
    thick: 0.3
outputs:
  run_root: runs
  save_previews: true
  save_masks: true
  sqlite_path: storage/flakefinder.db
