config_key: bn90_hbn
material: hBN
substrate: Si/SiO2 dry oxide
oxide_thickness_nm: 90
objective_magnification: 20
config_version: 0.1.0
hardware:
  backend: micromanager
  objective: 20x
  pixel_size_um: 0.5
  frame_width_px: 1024
  frame_height_px: 768
  overlap: 0.1
  roi:
    x_mm: 0.0
    y_mm: 0.0
    width_mm: 5.0
    height_mm: 5.0
camera:
  exposure_ms: 30.0
  gain: 0.0
  illumination:
    brightness: 0.8
focus:
  mode: none
preprocessing:
  demosaic: false
  linearize: false
  darkframe_subtraction: false
  flatfield_correction: false
  normalize_background: true
detector:
  name: 2dmatgmm
  model_path: ../2DMatGMM-System/Parameters/GMM_Parameters/hbn_90nm.json
  size_threshold: 250
  std_threshold: 5.0
  confidence_threshold: 0.2
ranking:
  weights:
    confidence: 0.25
    area: 0.15
    isolation: 0.1
    edge_straightness: 0.1
    compactness: 0.1
    background_cleanliness: 0.1
    focus_score: 0.1
    layer_bin: 0.05
    contrast_sanity: 0.05
  layer_preferences:
    thin: 1.0
    unknown: 0.6
    thick: 0.4
outputs:
  run_root: runs
  save_previews: true
  save_masks: true
  sqlite_path: storage/flakefinder.db
